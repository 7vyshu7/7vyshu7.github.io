<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReOil Receipt</title>
<style>
  :root{
    --bg:#F6F3F1; --card:#FFFFFF; --ink:#2A1F1F; --muted:#8A7E7C;
    --red:#9E1B1F; --gold:#C9962B; --line:#EADFCB;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141011; --card:#1E1819; --ink:#F2ECEA; --muted:#A99D9A;
           --red:#E0565A; --gold:#E2B252; --line:#3A3027; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       display:flex;justify-content:center;align-items:flex-start;padding:48px 20px}
  .card{width:100%;max-width:380px;background:var(--card);border-radius:18px;
        padding:32px 28px 30px;box-shadow:0 10px 30px rgba(80,30,20,.08);
        border-top:4px solid var(--gold)}
  .head{display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-size:24px;font-weight:700;letter-spacing:.5px;color:var(--red)}
  .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
  .reward{margin:34px 0 4px;text-align:center}
  .reward .label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .reward .amount{font-size:52px;font-weight:700;color:var(--red);margin-top:6px;font-variant-numeric:tabular-nums}
  .rule{height:1px;background:var(--gold);opacity:.6;margin:28px 0 8px}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);margin:34px 0 6px;line-height:1.6;font-size:15px}
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="brand">ReOil</div>
      <div class="tag" id="demo" hidden>Demo</div>
    </div>

    <div id="receipt" hidden>
      <div class="reward">
        <div class="label">Reward</div>
        <div class="amount" id="rm"></div>
      </div>
      <div class="rule"></div>
      <div class="row"><span>Receipt no.</span><span id="no"></span></div>
      <div class="row"><span>Date</span><span id="date"></span></div>
      <div class="row"><span>Oil weight</span><span id="kg"></span></div>
      <div class="row"><span>Volume</span><span id="litre"></span></div>
    </div>

    <p class="empty" id="empty" hidden>Scan the QR code on a ReOil station to see your receipt.</p>
  </main>

  <!-- Reads the receipt from the QR link, e.g. #12-452-7Q3K or #12-452-7Q3K-D (D = demo) -->
  <script>
  function show(id, text){ var el=document.getElementById(id); if(el) el.textContent=text; }
  function render(){
    var m=(location.hash||"").match(/^#(\d{1,5})-(\d{1,5})-([A-Z0-9]{4})(-D)?$/i);
    document.getElementById("receipt").hidden=!m;
    document.getElementById("empty").hidden=!!m;
    document.getElementById("demo").hidden=!(m&&m[4]);
    if(!m) return;
    var grams=parseInt(m[2],10), litres=grams/0.92/1000;
    show("no","#"+("0000"+m[1]).slice(-4));
    show("kg",(grams/1000).toFixed(3)+" kg");
    show("litre",litres.toFixed(3)+" L");
    show("rm","RM"+litres.toFixed(2));
    var d=new Date();
    show("date",d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+", "+
                d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
  }
  window.addEventListener("hashchange",render);
  render();
  </script>
</body>
</html>
